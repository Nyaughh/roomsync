[package]
name = "roomsync-desktop"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
publish = false
[workspace]
[dependencies]
roomsync-core = { path = "../.." }
roomsync-transport = { path = "../../adapters/transport" }
roomsync-windows = { path = "../../adapters/windows" }
crossbeam-queue = "0.3.12"
ctrlc = "3.4"
getrandom = "0.3"
zeroize = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
if-addrs = "0.14"
qrcodegen = "1.8"
[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
all = "warn"
