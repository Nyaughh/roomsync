name: Native desktop verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt
      - run: cargo fmt --manifest-path adapters/transport/Cargo.toml --check
      - run: cargo fmt --manifest-path adapters/windows/Cargo.toml --check
      - run: cargo fmt --manifest-path apps/desktop/Cargo.toml --check
      - run: cargo clippy --manifest-path adapters/transport/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo clippy --manifest-path adapters/windows/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo clippy --manifest-path apps/desktop/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path adapters/transport/Cargo.toml --all-targets --locked
      - run: cargo test --manifest-path adapters/windows/Cargo.toml --all-targets --locked
      - run: cargo test --manifest-path apps/desktop/Cargo.toml --all-targets --locked
      - run: cargo build --manifest-path apps/desktop/Cargo.toml --release --locked
      - name: Install Node for dependency-free controller state tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check apps/desktop/ui/app.js
      - run: node --test apps/desktop/tests/ui-state.test.cjs

  android-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt
      - name: Install Java for JNI and portable Android logic tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test Rust, JVM/JNI lifecycle, timing, pairing and QR parsing
        run: bash apps/android/test.sh
        # The optional wall-clock live smoke is intentionally excluded from CI.
        # Deterministic capture-availability scheduling is tested by desktop tests.
